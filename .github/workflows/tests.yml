name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

# A new push to a pull request cancels the run of the commit it replaces. A
# push to a branch gets its own group, so every commit on master is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  data:
    # Download the test data once per OS (instead of once per matrix leg) and
    # save it to the Actions cache for the test jobs. Harvard Dataverse
    # intermittently returns 403 to bursts of concurrent CI downloads, so the
    # fetch script retries with backoff.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Look up the test data cache
      # Downloads nothing; the cache is restored below only on a miss.
      uses: actions/cache/restore@v4
      id: probe
      with:
        path: |
          ~/.cache/astro-brutus/
          ~/Library/Caches/astro-brutus/
        # The test job restores this key; keep the two equal.
        key: brutus-data-v4-${{ runner.os }}-${{ hashFiles('src/brutus/data/download.py', '.github/scripts/fetch_test_data.py') }}
        lookup-only: true

    - name: Cache test data files
      if: steps.probe.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/astro-brutus/
          ~/Library/Caches/astro-brutus/
        key: ${{ steps.probe.outputs.cache-primary-key }}
        restore-keys: |
          brutus-data-v4-${{ runner.os }}-

    - name: Set up Python
      if: steps.probe.outputs.cache-hit != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Download test data files
      if: steps.probe.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        python .github/scripts/fetch_test_data.py

  test:
    needs: data
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # Default legs install unpinned dependencies and therefore exercise
        # numpy 2.x -- the version users actually get. Python 3.8 dropped
        # (EOL Oct 2024); Windows is unsupported via healpy (use WSL, see README).
        include:
          # numpy 1.x floor-compatibility check
          - os: ubuntu-latest
            python-version: "3.11"
            numpy_spec: "numpy>=1.19,<2.0"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # The key changes only with pyproject.toml, so new dependency
        # releases are downloaded until it changes.
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # The numpy 1.x floor leg pins numpy (and a compatible numba) explicitly;
        # all other legs install unpinned and resolve numpy 2.x. brutus is pure
        # Python and the numeric dependencies ship wheels for 3.9-3.13, so no
        # build-isolation gymnastics are required.
        if [ -n "${{ matrix.numpy_spec }}" ]; then
          pip install "${{ matrix.numpy_spec }}" "numba<0.60"
        fi
        pip install -e ".[test]"

    - name: Restore test data files
      # Populated by the `data` job; test jobs never download from Dataverse
      # themselves (concurrent downloads from every matrix leg get 403s).
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/astro-brutus/
          ~/Library/Caches/astro-brutus/
        key: brutus-data-v4-${{ runner.os }}-${{ hashFiles('src/brutus/data/download.py', '.github/scripts/fetch_test_data.py') }}
        fail-on-cache-miss: true

    - name: Cache the EEPTracks pickle
      # EEPTracks writes its pickle next to the track file, inside the data
      # directory. Its own small cache saves each leg the rebuild without
      # touching the data cache. The key holds the Python version (the pickle
      # holds scipy objects), the code that sets its format, and the data key's
      # inputs (EEPTracks rebuilds a pickle older than the track file).
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/astro-brutus/MIST_1.2_EEPtrk_*.pkl
          ~/Library/Caches/astro-brutus/MIST_1.2_EEPtrk_*.pkl
        key: eeptracks-v1-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/brutus/core/individual.py', 'src/brutus/data/download.py', '.github/scripts/fetch_test_data.py') }}

    - name: Verify test data files
      # Hash-checks the restored files and symlinks them into data/DATAFILES;
      # with the cache restored this makes no network requests.
      run: python .github/scripts/fetch_test_data.py --no-retry

    - name: Test with pytest
      env:
        NUMBA_DISABLE_JIT: 1
      run: |
        pytest tests/ -v --cov=brutus --cov-report=xml

    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run pre-commit
      # The same hooks and pinned versions that contributors run locally.
      uses: pre-commit/action@v3.0.1
      with:
        extra_args: --all-files --show-diff-on-failure

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine trove-classifiers

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      # The same checks as release.yml, so a bad classifier or README fails
      # here and not after the tag is public.
      run: |
        twine check --strict dist/*
        python .github/scripts/check_dist.py

    - name: Test install from wheel
      run: |
        pip install dist/*.whl
        python -c "import brutus; print(brutus.__version__)"
