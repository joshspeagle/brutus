.7">Ks</text><path d="M170.0 47.5L240.3 43.5L292.5 50.1L333.2 59.7L360.2 68.0L430.5 94.9L510.5 133.0L582.8 172.2" style="stroke:currentColor;fill:none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" /><path d="M170.0 115.2L240.3 111.2L292.5 117.8L333.2 127.5L360.2 135.7L430.5 162.6L510.5 200.7L582.8 239.9" style="stroke:var(--brutus-amber);fill:none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M170.0 199.1L240.3 166.9L292.5 158.9L333.2 159.9L360.2 163.4L430.5 181.0L510.5 212.2L582.8 247.5" style="stroke:var(--brutus-red);fill:none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M170.0 197.9L170.0 211.4" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="170.0" cy="204.6" r="4" fill="currentColor"/><path d="M240.3 153.3L240.3 166.8" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="240.3" cy="160.0" r="4" fill="currentColor"/><path d="M292.5 153.3L292.5 166.8" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="292.5" cy="160.0" r="4" fill="currentColor"/><path d="M333.2 151.6L333.2 165.1" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="333.2" cy="158.3" r="4" fill="currentColor"/><path d="M360.2 155.4L360.2 168.9" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="360.2" cy="162.1" r="4" fill="currentColor"/><path d="M430.5 173.6L430.5 187.1" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="430.5" cy="180.4" r="4" fill="currentColor"/><path d="M510.5 200.0L510.5 213.5" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="510.5" cy="206.8" r="4" fill="currentColor"/><path d="M582.8 240.1L582.8 253.6" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="582.8" cy="246.9" r="4" fill="currentColor"/><text x="596.8" y="176.2" text-anchor="start" font-size="12" font-weight="normal" fill="currentColor" style="">model SED at 1 kpc</text><text x="596.8" y="243.9" text-anchor="start" font-size="12" font-weight="normal" fill="currentColor" style="">moved to distance d</text><text x="596.8" y="261.9" text-anchor="start" font-size="12" font-weight="normal" fill="currentColor" style="">dimmed by dust; data</text><path d="M202.4 51.6L202.4 108.4" style="stroke:currentColor;fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#forward-model-ah)"/><path d="M202.4 119.4L202.4 179.3" style="stroke:var(--brutus-red);fill:none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#forward-model-ah)"/><text x="210.4" y="83.5" text-anchor="start" font-size="12" font-weight="normal" fill="currentColor" style="">scale = (1 kpc / d)²</text><text x="210.4" y="142.8" text-anchor="start" font-size="12" font-weight="normal" fill="currentColor" style="">dust: most in blue</text></svg>
