name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  data:
    # Download the test data once per OS (instead of once per matrix leg) and
    # save it to the Actions cache for the test jobs. Harvard Dataverse
    # intermittently returns 403 to bursts of concurrent CI downloads, so the
    # fetch script retries with backoff.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Cache test data files
      uses: actions/cache@v4
      id: cache-data
      with:
        path: |
          ~/.cache/astro-brutus/
          ~/Library/Caches/astro-brutus/
        key: brutus-data-v3-${{ runner.os }}-${{ hashFiles('src/brutus/data/download.py') }}
        restore-keys: |
          brutus-data-v3-${{ runner.os }}-

    - name: Set up Python
      if: steps.cache-data.outputs.cache-hit != 'true'
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Download test data files
      if: steps.cache-data.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        python .github/scripts/fetch_test_data.py

  test:
    needs: data
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # Default legs install unpinned dependencies and therefore exercise
        # numpy 2.x -- the version users actually get. Python 3.8 dropped
        # (EOL Oct 2024); Windows is unsupported via healpy (use WSL, see README).
        include:
          # numpy 1.x floor-compatibility check
          - os: ubuntu-latest
            python-version: "3.11"
            numpy_spec: "numpy>=1.19,<2.0"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # The numpy 1.x floor leg pins numpy (and a compatible numba) explicitly;
        # all other legs install unpinned and resolve numpy 2.x. brutus is pure
        # Python and the numeric dependencies ship wheels for 3.9-3.13, so no
        # build-isolation gymnastics are required.
        if [ -n "${{ matrix.numpy_spec }}" ]; then
          pip install "${{ matrix.numpy_spec }}" "numba<0.60"
        fi
        pip install -e ".[test]"

    - name: Restore test data files
      # Populated by the `data` job; test jobs never download from Dataverse
      # themselves (concurrent downloads from every matrix leg get 403s).
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/astro-brutus/
          ~/Library/Caches/astro-brutus/
        key: brutus-data-v3-${{ runner.os }}-${{ hashFiles('src/brutus/data/download.py') }}
        fail-on-cache-miss: true

    - name: Verify test data files
      # Hash-checks the restored files and symlinks them into data/DATAFILES;
      # with the cache restored this makes no network requests.
      run: python .github/scripts/fetch_test_data.py --no-retry

    - name: Lint with flake8
      run: |
        # Install flake8 if it's not in test dependencies
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/brutus --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Line length is handled by black.
        flake8 src/brutus --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Test with pytest
      env:
        NUMBA_DISABLE_JIT: 1
      run: |
        pytest tests/ -v --cov=brutus --cov-report=xml

    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check formatting with black
      run: |
        black --check --diff src/brutus tests/

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff src/brutus tests/

    # Type checking is currently optional - mypy has many false positives
    # with scientific Python code (numpy, scipy, etc.)
    # - name: Type checking with mypy
    #   run: |
    #     mypy src/brutus --ignore-missing-imports
    #   continue-on-error: true

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package with twine
      run: |
        twine check dist/*

    - name: Test install from wheel
      run: |
        pip install dist/*.whl
        python -c "import brutus; print(brutus.__version__)"
