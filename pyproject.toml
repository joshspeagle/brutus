[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-brutus"
version = "1.2.0"
description = "Brute-force Bayesian inference for photometric distances, reddenings, and stellar properties"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Joshua S Speagle", email = "j.speagle@utoronto.ca"}
]
maintainers = [
    {name = "Joshua S Speagle", email = "j.speagle@utoronto.ca"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]
keywords = [
    "brute force", "photometry", "bayesian", "stellar", "star",
    "cluster", "isochrone", "dust", "reddening",
    "parallax", "distance", "template fitting"
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.6.0",
    "matplotlib>=3.3.0",
    "h5py>=3.0.0",
    "healpy>=1.14.0",
    "astropy>=6.1",
    "numba>=0.59.0",
    "pooch>=1.4.0",
    "tqdm>=4.50.0",
]
# dynamic = ["version"]  # removed to avoid conflict with static 'version' field

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black>=21.0",
    "flake8>=3.8",
    "isort>=5.0",
]
docs = [
    "sphinx>=6.0",
    "furo>=2024.8.6",
    "sphinx-design>=0.5.0",
    "sphinx-copybutton>=0.5.0",
    "sphinxcontrib-bibtex>=2.6",
    "jupyter>=1.0",
    "myst-nb>=1.0",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
]

[project.urls]
Homepage = "https://github.com/joshspeagle/brutus"
Repository = "https://github.com/joshspeagle/brutus"
Documentation = "https://brutus.readthedocs.io"
"Bug Tracker" = "https://github.com/joshspeagle/brutus/issues"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.dat", "*.txt", "*.md"]

# Development tools configuration
[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    # directories
    \.eggs
    | \.git
    | \.hg
    | \.tox
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "6.0"
# Coverage flags are intentionally NOT enabled by default. Writing the HTML
# coverage report fails on some filesystems (notably WSL/DrvFs, with
# "OSError: [Errno 22] Invalid argument" on htmlcov/*), which aborts every
# pytest invocation including --collect-only. Default runs therefore omit
# coverage; CI measures it explicitly (see .github/workflows/tests.yml):
#   NUMBA_DISABLE_JIT=1 pytest tests/ --cov=brutus --cov-report=xml
# For a local coverage report, run that command yourself.
addopts = [
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow-running (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
# Note: Set NUMBA_DISABLE_JIT=1 environment variable for accurate coverage
# of @jit/@njit decorated functions. Without this, numba-compiled functions
# will show 0% coverage even if executed by tests.

[tool.coverage.run]
source = ["src/brutus"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    'if __name__ == "__main__":',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]
