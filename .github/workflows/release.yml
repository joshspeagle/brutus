name: Publish to PyPI

# Triggered only by pushing a version tag (e.g. `git tag v1.2.1 && git push --tags`).
#
# Publishing uses Trusted Publishing (OIDC) -- no API token is stored in the repo.
# Before this can work, configure a trusted publisher on BOTH indexes for project
# "astro-brutus": owner joshspeagle, repo brutus, workflow "release.yml", with
# environment "testpypi" on TestPyPI and "pypi" on PyPI.
#   PyPI:     https://pypi.org/manage/project/astro-brutus/settings/publishing/
#   TestPyPI: https://test.pypi.org/manage/project/astro-brutus/settings/publishing/
# See https://docs.pypi.org/trusted-publishers/.
#
# The flow is: build -> publish to TestPyPI -> check that TestPyPI serves this
# build, install it and import it -> wait for the lead's approval -> publish to
# PyPI. A release that cannot be installed never reaches PyPI. `skip-existing`
# keeps re-runs of an already-published tag green; the sha256 check then catches
# a stale upload. Re-run only the failed jobs: a new build job can use a newer
# setuptools, whose wheel differs from the one on TestPyPI.
#
# Approval gate: the "pypi" environment requires a reviewer (joshspeagle), set in
# the repository settings under Environments. The PyPI job waits until the lead
# approves it there. The build job also fails unless the tagged commit is on
# master.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the ancestry check

      - name: Verify the tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on master"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine trove-classifiers
          # Timestamps from the commit make the wheel byte-identical when the
          # same commit is built again (checked against TestPyPI below).
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build
          twine check --strict dist/*

      - name: Validate trove classifiers
        run: python .github/scripts/check_dist.py

      - name: Verify the tag matches the package version
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package version: $PKG_VERSION ; tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/astro-brutus/
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: Install from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installing the local wheel takes every dependency from PyPI, so no
      # package on TestPyPI can stand in for one.
      - name: Install the built wheel
        run: pip install dist/*.whl

      # The retry loop absorbs TestPyPI index propagation lag.
      - name: Download the release wheel from TestPyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if pip download --no-deps --only-binary=:all: \
                --index-url https://test.pypi.org/simple/ \
                -d testpypi/ "astro-brutus==${VERSION}"; then
              echo "downloaded on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; waiting for TestPyPI to propagate"
            sleep 15
          done
          echo "::error::could not download astro-brutus==${VERSION} from TestPyPI"
          exit 1

      # With skip-existing, an earlier upload of the same version may be what
      # TestPyPI serves; it must be byte-identical to this run's build.
      - name: Check the TestPyPI wheel is this run's build
        run: |
          built=$(sha256sum dist/*.whl | cut -d' ' -f1)
          served=$(sha256sum testpypi/*.whl | cut -d' ' -f1)
          echo "built: $built ; served: $served"
          if [ "$built" != "$served" ]; then
            echo "::error::TestPyPI serves a different wheel for this version"
            exit 1
          fi

      - name: Import the package
        run: |
          python -c "
          import brutus
          from brutus.core import StarGrid, Isochrone, StellarPop, EEPTracks
          from brutus.analysis import BruteForce
          from brutus.data import load_models
          from brutus.dust import Bayestar
          from brutus.plotting import cornerplot, summary_plot
          from brutus.utils import inv_magnitude
          print('imported brutus', brutus.__version__)
          "

  publish-pypi:
    name: Publish to PyPI
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/astro-brutus/
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
